seed: 42

data:
  hotpot:
    tag: hotpot
    hf_name: hotpotqa/hotpot_qa
    hf_config: distractor
    split: validation
    n_questions: 200
  twowiki:
    tag: twowiki
    hf_name: framolfese/2WikiMultihopQA
    hf_config: null
    split: validation
    n_questions: 200
  trivia:
    tag: trivia
    hf_name: mandarjoshi/trivia_qa
    hf_config: rc.wikipedia
    split: validation
    n_questions: 200
    loader: trivia
  longbench:
    tag: longbench
    hf_name: Xnhyacinth/LongBench
    hf_config: hotpotqa
    split: test
    n_questions: 200
    loader: longbench
  cache_dir: data_v2

retriever: bm25
top_k: 5

# E5 (quantization) + E6 (model size): 3B{ Q4,Q8 } and 7B{ Q4 }
models:
  - name: qwen2.5:3b-instruct
    label: "3B / Q4_K_M"
    family: "3B"
    quant: "Q4_K_M"
  - name: qwen2.5:3b-instruct-q8_0
    label: "3B / Q8_0"
    family: "3B"
    quant: "Q8_0"
  - name: qwen2.5:7b-instruct-q4_K_M
    label: "7B / Q4_K_M"
    family: "7B"
    quant: "Q4_K_M"
  - name: qwen2.5:7b-instruct-q8_0
    label: "7B / Q8_0"
    family: "7B"
    quant: "Q8_0"

# E1/E8: decode-scaling curve TPOT(L)
scaling:
  lengths: [256, 512, 1024, 2048, 4096, 8192, 16384]
  replicates: 2
  question: "Describe in detail how a bicycle works, listing its main parts and what each does."

# E1: compressed-context TPOT(L) curve (full vs compressed)
scaling_compressed:
  lengths: [256, 512, 1024, 2048, 4096, 8192]
  replicates: 2
  ratio: 0.25

# E8: CPU utilization + achieved-bandwidth telemetry (roofline)
e8:
  lengths: [512, 2048, 8192]
  replicates: 2

# H1: generation-length crossover sweep (find where decode vs prefill cross)
crossover:
  lengths: [512, 2048, 8192]
  num_predict: [16, 64, 128, 256, 512]
  replicates: 1
  question: "Describe in detail how a bicycle works, listing its main parts and what each does."

# E2/E3/E4/E7 + Sec.17 ablation: compression methods
compression:
  methods: [full, fixed_0.8, fixed_0.6, fixed_0.5, fixed_0.4, fixed_0.2, rel_iso, decaf_lam2, decaf_lam6, decaf_lam15, decaf_nocov_lam6, decaf_noreorder_lam6, bm25_decaf_lam6, llmlingua_0.5, llmlingua_0.2]
  decaf_primary: decaf_lam6
  lambda: 1.5
  fixed_ratios: [0.5, 0.2]

# H5 secondary analysis: llama.cpp prefix/KV cache reuse
h5:
  prefix_lengths: [2048, 8192]
  replicates: 2

# Sec.13 retrieval-mode study (BM25 vs dense vs hybrid top-k)
retrieval:
  retrievers: [dense, hybrid]
  dense_model: "BAAI/bge-small-en-v1.5"
  methods: [full, fixed_0.5, decaf_lam6]
  models: ["qwen2.5:3b-instruct", "qwen2.5:3b-instruct-q8_0", "qwen2.5:7b-instruct-q4_K_M", "qwen2.5:7b-instruct-q8_0"]
  n_questions: 30

scorer:
  cross_encoder: BAAI/bge-reranker-base
  max_length: 512

ollama:
  host: http://localhost:11434
  temperature: 0.0
  num_predict: 32
  num_ctx: 20480
  timeout: 3600
  logprobs: false

paths:
  scaling_cache: cache_v2/scaling.jsonl
  scaling_compressed_cache: cache_v2/scaling_compressed.jsonl
  e8_cache: cache_v2/e8.jsonl
  crossover_cache: cache_v2/crossover.jsonl
  compress_cache: cache_v2/compression.jsonl
  ce_cache: cache_v2/ce_scores
  h5_cache: cache_v2/h5_prefix.jsonl
  retrieval_cache: cache_v2/retrieval.jsonl
  results: results_v2
